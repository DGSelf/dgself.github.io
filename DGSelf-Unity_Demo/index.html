<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>DGSelf — Interactive 3D Avatar Hub Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030712;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #f8fafc;
        user-select: none;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030712;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #030712;
        outline: none;
      }
      /* Standalone fallback loader when opened directly outside parent site */
      #standalone-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0a1628 0%, #030712 100%);
        z-index: 20;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #standalone-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .standalone-brand {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .standalone-brand span {
        background: linear-gradient(135deg, #38bdf8, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .standalone-sub {
        font-size: 0.9rem;
        color: #94a3b8;
        margin-bottom: 1.75rem;
      }
      .standalone-bar-wrap {
        width: min(380px, 82vw);
        height: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      .standalone-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb, #00c8ff, #38bdf8);
        border-radius: 999px;
        box-shadow: 0 0 16px rgba(0, 200, 255, 0.65);
        transition: width 0.2s ease-out;
      }
      .standalone-pct {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: #38bdf8;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    </div>

    <div id="standalone-loader" class="hidden">
      <div class="standalone-brand">DG<span>Self</span></div>
      <div class="standalone-sub" id="standalone-status">Initializing 3D Avatar Identity Environment...</div>
      <div class="standalone-bar-wrap">
        <div class="standalone-bar-fill" id="standalone-bar"></div>
      </div>
      <div class="standalone-pct" id="standalone-pct">0%</div>
    </div>

    <script>
      (function () {
        var isEmbedded = window.self !== window.top;
        var isDemoActive = !isEmbedded; // Hidden until parent triggers show when embedded
        var isEngineReady = false;
        var trackedAudioContexts = [];

        // Show standalone loader only when opened directly
        var standaloneLoader = document.getElementById('standalone-loader');
        var standaloneBar = document.getElementById('standalone-bar');
        var standalonePct = document.getElementById('standalone-pct');
        if (!isEmbedded && standaloneLoader) {
          standaloneLoader.classList.remove('hidden');
        }

        // Intercept AudioContext so background preloading stays completely silent until Player card is clicked
        var OrigAudioContext = window.AudioContext || window.webkitAudioContext;
        if (OrigAudioContext) {
          function PatchedAudioContext() {
            var ctx = new OrigAudioContext();
            trackedAudioContexts.push(ctx);
            if (!isDemoActive && ctx.state === 'running' && typeof ctx.suspend === 'function') {
              ctx.suspend().catch(function () {});
            }
            return ctx;
          }
          PatchedAudioContext.prototype = OrigAudioContext.prototype;
          window.AudioContext = PatchedAudioContext;
          if (window.webkitAudioContext) {
            window.webkitAudioContext = PatchedAudioContext;
          }
        }

        function syncAudioAndFocus(active) {
          isDemoActive = active;
          trackedAudioContexts.forEach(function (ctx) {
            if (!ctx || ctx.state === 'closed') return;
            if (active && typeof ctx.resume === 'function') {
              ctx.resume().catch(function () {});
            } else if (!active && typeof ctx.suspend === 'function') {
              ctx.suspend().catch(function () {});
            }
          });
          if (active) {
            var canvas = document.getElementById('unity-canvas');
            if (canvas) {
              canvas.focus();
            }
          }
        }

        // Expose state & control API for same-origin parent page
        window.dgselfUnityState = {
          progress: 0,
          loadedBytes: 0,
          totalBytes: 0,
          filesFinished: 0,
          totalFiles: 14,
          ready: false,
          error: null,
          instance: null,
          setActive: syncAudioAndFocus,
          setFullscreen: function () {
            if (window.dgselfUnityState.instance) {
              window.dgselfUnityState.instance.SetFullscreen(1);
            }
          }
        };

        window.addEventListener('message', function (event) {
          if (!event || !event.data) return;
          if (event.data.type === 'DGSELF_DEMO_SHOW') {
            syncAudioAndFocus(true);
          } else if (event.data.type === 'DGSELF_DEMO_HIDE') {
            syncAudioAndFocus(false);
          } else if (event.data.type === 'DGSELF_DEMO_FULLSCREEN') {
            window.dgselfUnityState.setFullscreen();
          }
        });

        function notifyParent(type, payload) {
          if (isEmbedded && window.parent) {
            try {
              window.parent.postMessage(Object.assign({ type: type }, payload || {}), '*');
            } catch (e) {}
          }
        }

        window.__onUnityDetailedProgress = function (progress, downloadProgressMap) {
          var loadedBytes = 0;
          var totalBytes = 0;
          var filesFinished = 0;
          var totalFiles = 0;

          if (downloadProgressMap) {
            var entries = Object.values(downloadProgressMap);
            totalFiles = entries.length;
            for (var i = 0; i < entries.length; i++) {
              var item = entries[i];
              if (!item) continue;
              loadedBytes += item.loaded || 0;
              totalBytes += item.total || 0;
              if (item.finished) filesFinished++;
            }
          }

          window.dgselfUnityState.progress = progress;
          window.dgselfUnityState.loadedBytes = loadedBytes;
          window.dgselfUnityState.totalBytes = totalBytes;
          window.dgselfUnityState.filesFinished = filesFinished;
          window.dgselfUnityState.totalFiles = totalFiles || 14;

          notifyParent('DGSELF_UNITY_PROGRESS', {
            progress: progress,
            loadedBytes: loadedBytes,
            totalBytes: totalBytes,
            filesFinished: filesFinished,
            totalFiles: totalFiles || 14
          });
        };

        window.__notifyParent = notifyParent;
      })();
    </script>
    <script src="Build/DGSelf-Unity_Demo.loader.js"></script>
    <script>
      (function () {
        var canvas = document.querySelector("#unity-canvas");
        var standaloneLoader = document.getElementById('standalone-loader');
        var standaloneBar = document.getElementById('standalone-bar');
        var standalonePct = document.getElementById('standalone-pct');

        createUnityInstance(canvas, {
          arguments: [],
          primaryDataUrls: [
            "globalgamemanagers.br",
            "globalgamemanagers.assets.br",
            "level0.br",
            "resources.assets.br",
            "Resources/unity_builtin_extra.br",
            "RuntimeInitializeOnLoads.json.br",
            "ScriptingAssemblies.json.br",
            "sharedassets0.assets.br",
            "sharedassets0.resource.br",
            "boot.config.br",
            "Il2CppData/Metadata/global-metadata.dat.br",
            "Resources/unity default resources.br"
          ],
          secondaryDataUrls: [
            "level1.br",
            "sharedassets1.assets.br",
            "level2.br",
            "sharedassets2.assets.br",
            "level3.br",
            "sharedassets3.assets.br",
            "level4.br",
            "sharedassets4.assets.br",
            "level5.br",
            "sharedassets5.assets.br"
          ],
          frameworkUrl: "Build/DGSelf-Unity_Demo.framework.js.br",
          codeUrl: "Build/DGSelf-Unity_Demo.wasm.br",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Temo Kokiashvili",
          productName: "DGSelf-Unity",
          productVersion: "0.1.0",
          onDetailedProgress: function (progress, map) {
            if (window.__onUnityDetailedProgress) {
              window.__onUnityDetailedProgress(progress, map);
            }
          }
        }, function (progress) {
          window.dgselfUnityState.progress = progress;
          var pct = Math.min(100, Math.round(progress * 100));
          if (standaloneBar) standaloneBar.style.width = pct + '%';
          if (standalonePct) standalonePct.textContent = pct + '%';
          if (window.__notifyParent) {
            window.__notifyParent('DGSELF_UNITY_PROGRESS', {
              progress: progress,
              loadedBytes: window.dgselfUnityState.loadedBytes,
              totalBytes: window.dgselfUnityState.totalBytes,
              filesFinished: window.dgselfUnityState.filesFinished,
              totalFiles: window.dgselfUnityState.totalFiles
            });
          }
        }).then(function (unityInstance) {
          window.dgselfUnityState.instance = unityInstance;
          window.dgselfUnityState.ready = true;
          window.dgselfUnityState.progress = 1;
          if (standaloneLoader) {
            standaloneLoader.classList.add('hidden');
          }
          // Ensure audio stays muted if still preloading in background
          if (window.self !== window.top) {
            window.dgselfUnityState.setActive(false);
          }
          if (window.__notifyParent) {
            window.__notifyParent('DGSELF_UNITY_READY', { progress: 1 });
          }
        }).catch(function (message) {
          console.error("Unity WebGL load error:", message);
          window.dgselfUnityState.error = String(message);
          if (window.__notifyParent) {
            window.__notifyParent('DGSELF_UNITY_ERROR', { message: String(message) });
          }
        });
      })();
    </script>
  </body>
</html>
